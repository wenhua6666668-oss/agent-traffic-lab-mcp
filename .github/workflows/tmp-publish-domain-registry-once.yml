name: TMP Publish Domain Registry Once

on:
  push:
    paths:
      - '.github/workflows/tmp-publish-domain-registry-once.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate manifest
        run: ./mcp-publisher validate server.json
      - name: Authenticate canonical domain
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_PRIVATE_KEY"
          ./mcp-publisher login http --domain agenttrafficlab.com --private-key "$MCP_PRIVATE_KEY"
      - name: Publish 0.1.4
        run: ./mcp-publisher publish server.json
