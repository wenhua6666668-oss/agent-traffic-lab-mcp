name: Resubmit ATL to Neuronto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resubmit-neuronto-atl.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Resubmit live ATL MCP endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://neuronto.com/submit' \
            -H 'Content-Type: application/json' \
            -d '{"endpoint":"https://mcp.agenttrafficlab.com/mcp"}'
