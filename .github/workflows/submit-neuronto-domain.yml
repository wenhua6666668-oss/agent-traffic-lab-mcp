name: Submit ATL domain to Neuronto ARD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/submit-neuronto-domain.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit ATL discovery domain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://neuronto.com/submit' \
            -H 'content-type: application/json' \
            -d '{"domain":"agenttrafficlab.com"}'
