name: Publish MCP Registry v0.1.6 Once

on:
  push:
    branches:
      - registry/sync-v0.1.6-20261006
    paths:
      - ".github/workflows/publish-v016-once.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server manifest
        run: ./mcp-publisher validate server.json

      - name: Require registry signing key
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_PRIVATE_KEY:-}" ]; then
            echo "MCP_PRIVATE_KEY is not configured." >&2
            exit 1
          fi
          if ! printf '%s' "$MCP_PRIVATE_KEY" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "MCP_PRIVATE_KEY must be a 64-hex Ed25519 seed." >&2
            exit 1
          fi

      - name: Login with agenttrafficlab.com domain ownership
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login http --domain agenttrafficlab.com --private-key "$MCP_PRIVATE_KEY"

      - name: Publish v0.1.6
        run: ./mcp-publisher publish server.json
