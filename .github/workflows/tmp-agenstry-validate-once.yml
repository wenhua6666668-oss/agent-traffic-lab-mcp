name: TMP Agenstry Validate Once

on:
  push:
    paths:
      - '.github/workflows/tmp-agenstry-validate-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate and upsert ATL into Agenstry index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, uuid
          u='https://agenstry.com/a2a'
          h={'content-type':'application/json','A2A-Version':'1.0','user-agent':'atl-agenstry-validate/1'}
          payload={
            'jsonrpc':'2.0','id':'1','method':'SendMessage',
            'params':{'message':{'messageId':str(uuid.uuid4()),'role':'ROLE_USER','parts':[{'text':'validate: https://agenttrafficlab.com'}]}}
          }
          r=requests.post(u,headers=h,json=payload,timeout=60)
          print('AGENSTRY_VALIDATE_HTTP',r.status_code)
          print('AGENSTRY_VALIDATE_BODY',r.text[:8000])
          r.raise_for_status()
          if 'error' in (r.json() if r.headers.get('content-type','').startswith('application/json') else {}):
              raise SystemExit('Agenstry returned JSON-RPC error')
          # Verify the index can immediately resolve ATL after the upsert.
          r2=requests.get('https://agenstry.com/api/v1/skills/get_agent',params={'domain':'agenttrafficlab.com'},timeout=30)
          print('AGENSTRY_GET_HTTP',r2.status_code)
          print('AGENSTRY_GET_BODY',r2.text[:8000])
          r2.raise_for_status()
          PY
