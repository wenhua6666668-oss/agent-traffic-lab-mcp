name: Generate ATL ARD catalog with WellKnown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-wellknown-catalog.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate conformant catalog from live ATL domain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://wellknownhq.com/mcp?via=atl-discovery' \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"generate_catalog","arguments":{"domain":"agenttrafficlab.com"}}}'
