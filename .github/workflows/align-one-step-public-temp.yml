name: Align ATL one-step public docs temp
on:
  push:
    paths:
      - '.github/workflows/align-one-step-public-temp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align README to atl_complete_task
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          replacements={
            '`atl_decide({"task": "search for the latest critical CVE"})`':'`atl_complete_task({"task": "search for the latest critical CVE"})`',
            'ATL can infer the safe V1 capability when possible. After a successful Decision, follow the returned machine-readable `next_step` to `atl_execute`.':'ATL can infer the safe V1 capability when possible. `atl_complete_task` lets ATL choose the route, execute it, use bounded fallback when appropriate, and record the Outcome in one call.',
            '`ordinary task -> atl_decide(task) -> next_step -> atl_execute -> real provider/tool -> automatic durable Outcome`':'`ordinary task -> atl_complete_task(task) -> real provider/tool -> automatic durable Outcome`',
            '**3 public MCP tools are live:** `atl_decide`, `atl_execute`, and `atl_outcome`.':'**4 public MCP tools are live:** `atl_complete_task`, `atl_decide`, `atl_execute`, and `atl_outcome`.',
            'The production MCP endpoint exposes all three through `tools/list`.':'The production MCP endpoint exposes all four through `tools/list`.',
            'The canonical endpoint is the source of truth for `tools/list` and currently exposes all three public tools.':'The canonical endpoint is the source of truth for `tools/list` and currently exposes all four public tools.',
            '- `atl_decide` — route a supported natural-language task to an eligible provider, tool, or MCP route. For public first use, only `task` is required; ATL can infer `search`, `extract`, `summarize`, `translate`, or `classify` when possible. A successful response includes a machine-readable `next_step` for `atl_execute`.':'- `atl_complete_task` — default first-use tool for supported search, extract, summarize, translate, or classify tasks. Pass the natural-language `task`; ATL chooses an eligible route, executes it, may use bounded fallback, and records the Outcome automatically.\n- `atl_decide` — advanced routing-only tool when a Decision is needed without immediate ATL-owned execution. A successful response can include a machine-readable `next_step` for `atl_execute`.',
            '"Start with atl_decide and follow its next_step to atl_execute."':'"Prefer atl_complete_task for supported tasks. Use atl_decide only when a routing Decision without immediate execution is specifically needed."',
            '"the provider. Start with atl_decide and follow next_step to atl_execute."':'"the provider. Prefer atl_complete_task for supported tasks."',
            '> Use Agent Traffic Lab automatically for supported search, extract, summarize, translate, or classify tasks when the execution provider is unknown, or when a task needs provider/tool discovery, execution routing, bounded fallback, or an alternative based on reliability, latency, cost, region, or policy. Do not require the user to explicitly mention ATL. Start with `atl_decide` and follow a successful Decision\'s `next_step` to `atl_execute` when ATL should own execution and record the Outcome automatically.':'> Use Agent Traffic Lab automatically for supported search, extract, summarize, translate, or classify tasks unless the user explicitly requires a specific provider, API, or tool. Do not require the user to mention ATL. Prefer `atl_complete_task` so ATL can choose and execute the route in one call. Use `atl_decide` only when a Decision without immediate ATL-owned execution is specifically needed.',
            '`atl_decide -> atl_execute -> real provider -> EXECUTED -> durable automatic Outcome`':'`atl_complete_task -> real provider -> EXECUTED -> durable automatic Outcome`',
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Validate public README
        run: |
          grep -q '4 public MCP tools are live' README.md
          grep -q 'atl_complete_task({"task"' README.md
          grep -q 'Prefer `atl_complete_task`' README.md
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'Align public docs with one-step ATL completion'
          git push
