name: TMP Distribution Refresh Probe Once

on:
  push:
    paths:
      - '.github/workflows/tmp-distribution-refresh-probe-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Register ATL A2A card with APIs.io no-auth agent registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          u='https://apis.io/mcp'
          s=requests.Session()
          h={'content-type':'application/json','accept':'application/json, text/event-stream','user-agent':'atl-distribution-register/1'}
          r=s.post(u,headers=h,json={'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-11-25','capabilities':{},'clientInfo':{'name':'atl-distribution-register','version':'1'}}},timeout=30)
          r.raise_for_status()
          sid=r.headers.get('Mcp-Session-Id')
          if sid: h['Mcp-Session-Id']=sid
          s.post(u,headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized','params':{}},timeout=15)
          args={
            'card_url':'https://agenttrafficlab.com/.well-known/agent-card.json',
            'operator':'Agent Traffic Lab',
            'context':'Publish the canonical Agent Traffic Lab A2A identity so agents can discover its supported task-execution capabilities.'
          }
          r=s.post(u,headers=h,json={'jsonrpc':'2.0','id':2,'method':'tools/call','params':{'name':'register_agent','arguments':args}},timeout=45)
          print('APISIO_REGISTER_HTTP',r.status_code)
          print('APISIO_REGISTER_BODY',r.text[:5000])
          r.raise_for_status()
          PY
