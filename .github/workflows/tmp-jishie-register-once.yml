name: TMP Jishie Register Once

on:
  push:
    paths:
      - '.github/workflows/tmp-jishie-register-once.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Register ATL with Jishie public agent directory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          payload={
            'name':'Agent Traffic Lab',
            'mcp_endpoint':'https://mcp.agenttrafficlab.com/mcp',
            'skills':['search','extract','summarize','translate','classify','provider-routing','fallback-routing']
          }
          r=requests.post('https://jishie.com/v1/agents',json=payload,timeout=45,headers={'user-agent':'atl-jishie-register/1'})
          print('JISHIE_REGISTER_HTTP',r.status_code)
          print('JISHIE_REGISTER_BODY',r.text[:8000])
          r.raise_for_status()
          data=r.json() if 'json' in r.headers.get('content-type','') else {}
          if isinstance(data,dict) and data.get('error'):
              raise SystemExit('Jishie returned an application error')
          PY
