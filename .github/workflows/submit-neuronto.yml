name: Submit ATL to Neuronto ARD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/submit-neuronto.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit canonical ATL MCP endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://neuronto.com/submit' \
            -H 'content-type: application/json' \
            -d '{"endpoint":"https://mcp.agenttrafficlab.com/mcp"}'
