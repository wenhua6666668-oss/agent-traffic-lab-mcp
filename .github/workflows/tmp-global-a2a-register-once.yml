name: TMP Global A2A Register Once

on:
  push:
    paths:
      - '.github/workflows/tmp-global-a2a-register-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify ATL registry record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          base='https://api.a2a-registry.org'
          h={'user-agent':'atl-global-a2a-verify/1'}
          agent_id='1af1f124-abee-4f92-83f9-6647732091a8'
          for path,params in [
              (f'/public/agents/{agent_id}',None),
              ('/public/agents',{'q':'com.agenttrafficlab.agent_traffic_lab'}),
              ('/public/agents',{'q':'Agent Traffic Lab'})
          ]:
              r=requests.get(base+path,params=params,headers=h,timeout=30)
              print('VERIFY',path,params,'HTTP',r.status_code)
              print(r.text[:16000])
              r.raise_for_status()
          PY
