name: Search WellKnown for ATL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-wellknown-atl.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search public WellKnown registry for ATL
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://wellknownhq.com/registry/search' \
            -H 'Content-Type: application/json' \
            -d '{"query":{"text":"Agent Traffic Lab"},"pageSize":20}'
